<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-SOCIETY</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f; --brown:#d8bfa6; --violet:#c9b6e4; --text:#e0e0e0; --text-dim:#9a9aa5; --border:rgba(201,182,228,0.14);}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;}
  body{
    background:var(--bg); font-family:'Inter',sans-serif; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; overflow:hidden;
  }
  .logo{display:flex; align-items:center; gap:12px; margin-bottom:8px;}
  .logo svg{width:44px; height:44px;}
  .eagle-wing{ transform-origin:12px 12px; animation:flap 1.8s ease-in-out infinite; }
  @keyframes flap{ 0%,100%{transform:scaleY(1);} 50%{transform:scaleY(0.55) rotate(5deg);} }
  .logo-text{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:2px;
    background:linear-gradient(90deg,var(--brown),var(--violet)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}

  .cta{
    margin-top:46px; padding:16px 42px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(120deg,var(--brown),var(--violet)); color:#0a0a0f;
    font-weight:700; font-size:16px; font-family:'Inter',sans-serif;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(201,182,228,0.3);}
  .cta:active{transform:translateY(0) scale(0.97);}

  footer{position:fixed; bottom:24px; font-size:12px; color:var(--text-dim);}
  footer a{color:var(--violet); text-decoration:none;}

  @media (max-width:420px){ .logo-text{font-size:18px;} .cta{padding:14px 32px; font-size:15px;} }
  .tagline{margin-top:14px; color:var(--text-dim); font-size:14px; max-width:340px;}

  .hero-eagle{
    position:absolute; top:22%; left:50%; width:64px; height:64px;
    animation: fly-loop 9s ease-in-out infinite; opacity:0.85; pointer-events:none;
  }
  .hero-eagle .wing{ transform-origin:12px 12px; animation: flap 0.9s ease-in-out infinite; }
  @keyframes fly-loop{
    0%{ transform: translateX(-150px) translateY(0) scale(0.9) rotate(-4deg); opacity:0; }
    12%{ opacity:0.9; }
    45%{ transform: translateX(150px) translateY(-28px) scale(1.05) rotate(3deg); opacity:0.9; }
    55%{ opacity:0.9; }
    88%{ transform: translateX(-150px) translateY(0) scale(0.9) rotate(-4deg); opacity:0.9; }
    100%{ transform: translateX(-150px) translateY(0) scale(0.9) rotate(-4deg); opacity:0; }
  }
</style>
</head>
<body>

  <svg class="hero-eagle" viewBox="0 0 24 24" fill="none">
    <path class="wing" d="M12 12 L1 5 Q5 9 5 14 Q8 12 12 12 Z" fill="url(#gHero)"/>
    <path class="wing" d="M12 12 L23 5 Q19 9 19 14 Q16 12 12 12 Z" fill="url(#gHero)"/>
    <path d="M12 10.5 L10 16 L12 14.4 L14 16 Z" fill="url(#gHero)"/>
    <circle cx="12" cy="9.3" r="1.5" fill="url(#gHero)"/>
    <defs><linearGradient id="gHero" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#d8bfa6"/><stop offset="100%" stop-color="#c9b6e4"/>
    </linearGradient></defs>
  </svg>

  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none">
      <path class="eagle-wing" d="M12 12 L1 5 Q5 9 5 14 Q8 12 12 12 Z" fill="url(#g)"/>
      <path class="eagle-wing" d="M12 12 L23 5 Q19 9 19 14 Q16 12 12 12 Z" fill="url(#g)"/>
      <path d="M12 10.5 L10 16 L12 14.4 L14 16 Z" fill="url(#g)"/>
      <circle cx="12" cy="9.3" r="1.5" fill="url(#g)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
        <stop offset="0%" stop-color="#d8bfa6"/><stop offset="100%" stop-color="#c9b6e4"/>
      </linearGradient></defs>
    </svg>
    <div class="logo-text">G-SOCIETY</div>
  </div>
  <p class="tagline">L'accès unifié à nos services.</p>

  <button class="cta" id="btn-cta" onclick="commencer()">Commencer</button>

  <footer>© G-SOCIETY — <a href="cgu.html">Conditions d'utilisation</a></footer>

<script>
  function commencer(){
    const session = localStorage.getItem('gs_session');
    window.location.href = session ? "dashboard.html" : "login.html";
  }

  // Si déjà connecté, va directement au tableau de bord — pas la peine
  // de revoir cette page à chaque fois.
  if(localStorage.getItem('gs_session')){
    document.getElementById('btn-cta').textContent = "Continuer";
  }
</script>

</body>
</html>
