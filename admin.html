<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — G-SOCIETY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f; --card:rgba(255,255,255,0.03); --border:rgba(201,182,228,0.14);
        --brown:#d8bfa6; --violet:#c9b6e4; --text:#e0e0e0; --text-dim:#9a9aa5;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); min-height:100vh;}
  h1,h2{font-family:'Space Grotesk',sans-serif;}

  .navbar{height:60px; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--border);}
  .navbar a{color:var(--text-dim); text-decoration:none; font-size:13px;}
  .navbar a:hover{color:var(--violet);}
  .navbar .title{font-weight:700; font-family:'Space Grotesk',sans-serif;}

  .layout{display:flex; max-width:1000px; margin:0 auto;}
  .sidebar{width:200px; flex-shrink:0; padding:26px 12px; border-right:1px solid var(--border); min-height:calc(100vh - 60px);}
  .sidebar a{display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:9px;
    color:var(--text-dim); text-decoration:none; font-size:14px; margin-bottom:4px; cursor:pointer;}
  .sidebar a:hover{background:rgba(201,182,228,0.06); color:#fff;}
  .sidebar a.active{background:rgba(201,182,228,0.1); color:#fff;}

  .content{flex:1; padding:30px 28px 100px;}
  .panel{display:none;}
  .panel.active{display:block;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--text-dim); font-weight:500; padding:10px 8px; border-bottom:1px solid var(--border);}
  td{padding:10px 8px; border-bottom:1px solid var(--border);}
  .badge-admin{color:var(--violet); font-size:11px;}
  .badge-tag{background:rgba(216,191,166,0.15); color:var(--brown); padding:2px 8px; border-radius:999px; font-size:11px;}
  .row-actions{display:flex; gap:8px;}
  .row-actions button{padding:5px 10px; font-size:12px; border-radius:6px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); cursor:pointer;}
  .row-actions button:hover{border-color:var(--violet); color:#fff;}
  .row-actions button.danger:hover{border-color:#e05a5a; color:#f0a3a3;}

  .services{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
  .service-status{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px;}
  .service-status .name{font-weight:700; font-family:'Space Grotesk',sans-serif; margin-bottom:8px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px;}
  .dot.up{background:#5fd97a; box-shadow:0 0 6px #5fd97a;}
  .dot.down{background:#e05a5a; box-shadow:0 0 6px #e05a5a;}
  .dot.pending{background:#e0c97a; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .status-text{font-size:12.5px; color:var(--text-dim);}

  .result{margin-top:14px; padding:12px 14px; border-radius:9px; font-size:13.5px; display:none;}
  .result.ok{display:block; background:rgba(95,217,122,0.08); border:1px solid rgba(95,217,122,0.3); color:#8ee8a4;}
  .result.err{display:block; background:rgba(224,90,90,0.08); border:1px solid rgba(224,90,90,0.3); color:#f0a3a3;}

  #acces-refuse{display:none; text-align:center; padding:100px 24px; color:var(--text-dim);}
</style>
</head>
<body>

<div id="acces-refuse">
  <h1>Accès refusé</h1>
  <p style="margin-top:10px;">Cette section est réservée aux comptes administrateurs.</p>
  <p style="margin-top:20px;"><a href="dashboard.html" style="color:var(--violet);">Retour au tableau de bord</a></p>
</div>

<div id="admin-content" style="display:none;">
  <nav class="navbar">
    <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="title">Administration G-SOCIETY</div>
  </nav>

  <div class="layout">
    <div class="sidebar">
      <a data-panel="comptes" class="active"><i class="fa-solid fa-users"></i> Comptes</a>
      <a data-panel="monitoring"><i class="fa-solid fa-server"></i> Monitoring</a>
    </div>

    <div class="content">

      <div class="panel active" id="panel-comptes">
        <h2 style="margin-bottom:18px;">Comptes G-SOCIETY</h2>
        <table>
          <thead><tr><th>Compte</th><th>Clés générées</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody id="comptes-tbody"></tbody>
        </table>
        <div class="result" id="comptes-result"></div>
      </div>

      <div class="panel" id="panel-monitoring">
        <h2 style="margin-bottom:18px;">État des services</h2>
        <div class="services" id="services-grid"></div>
      </div>

    </div>
  </div>
</div>

<script>
const PLUTON_URL = "https://glitch-wbfo.onrender.com";
const sessionToken = localStorage.getItem('gs_session');

async function verifierAcces(){
  if(!sessionToken){ window.location.href = "login.html"; return; }
  const res = await fetch(PLUTON_URL + '/api/admin/verify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: sessionToken})
  });
  const data = await res.json();
  if(!data.is_admin){
    document.getElementById('acces-refuse').style.display = 'block';
    return;
  }
  document.getElementById('admin-content').style.display = 'block';
  chargerComptes();
  chargerMonitoring();
}
verifierAcces();

document.querySelectorAll('.sidebar a[data-panel]').forEach(a=>{
  a.addEventListener('click', ()=>{
    document.querySelectorAll('.sidebar a[data-panel]').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    a.classList.add('active');
    document.getElementById('panel-'+a.dataset.panel).classList.add('active');
  });
});

function afficherResultat(id, ok, message){
  const el = document.getElementById(id);
  el.className = 'result ' + (ok ? 'ok' : 'err');
  el.textContent = message;
}

async function chargerComptes(){
  const res = await fetch(PLUTON_URL + '/api/admin/accounts', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: sessionToken})
  });
  const data = await res.json();
  if(!data.success) return;
  const tbody = document.getElementById('comptes-tbody');
  tbody.innerHTML = '';
  data.comptes.forEach(c=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${c.username} ${c.is_admin ? '<span class="badge-admin">ADMIN</span>' : ''}</td>
      <td>${c.nb_cles}</td>
      <td>${c.badge ? `<span class="badge-tag">${c.badge}</span>` : '—'}</td>
      <td class="row-actions">
        <button onclick="certifier('${c.username}')">Certifier</button>
        <button class="danger" onclick="suspendre('${c.username}')">Suspendre</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

async function suspendre(username){
  if(!confirm(`Suspendre ${username} sur tous les services ?`)) return;
  const res = await fetch(PLUTON_URL + '/api/admin/suspend', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: sessionToken, username})
  });
  const data = await res.json();
  afficherResultat('comptes-result', data.success, data.message);
  if(data.success) chargerComptes();
}

async function certifier(username){
  const badge = prompt(`Nom du badge à attribuer à ${username} :`);
  if(!badge) return;
  const res = await fetch(PLUTON_URL + '/api/admin/certify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: sessionToken, username, badge})
  });
  const data = await res.json();
  afficherResultat('comptes-result', data.success, data.message);
  if(data.success) chargerComptes();
}

// --- Monitoring : ping direct depuis le navigateur, aucun calcul serveur ---
const SERVICES = [
  { nom: "Pluton", url: "https://glitch-wbfo.onrender.com/status" },
  { nom: "G-SOCIETY", url: "https://g-society.onrender.com/index.html" },
  { nom: "GRIND (app)", url: "https://grind-4vsz.onrender.com" },
];

async function chargerMonitoring(){
  const grid = document.getElementById('services-grid');
  grid.innerHTML = '';
  SERVICES.forEach(s=>{
    const div = document.createElement('div');
    div.className = 'service-status';
    div.innerHTML = `<div class="name">${s.nom}</div><div><span class="dot pending"></span><span class="status-text">Vérification...</span></div>`;
    grid.appendChild(div);
    fetch(s.url, { mode: 'no-cors' })
      .then(()=>{
        div.querySelector('.dot').className = 'dot up';
        div.querySelector('.status-text').textContent = 'En ligne';
      })
      .catch(()=>{
        div.querySelector('.dot').className = 'dot down';
        div.querySelector('.status-text').textContent = 'Injoignable';
      });
  });
}
</script>

</body>
</html>
