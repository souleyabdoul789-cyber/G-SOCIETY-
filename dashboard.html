<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — G-SOCIETY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f; --card:rgba(255,255,255,0.03); --border:rgba(201,182,228,0.14);
        --brown:#d8bfa6; --violet:#c9b6e4; --text:#e0e0e0; --text-dim:#9a9aa5;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); line-height:1.6;}
  h1,h2{font-family:'Space Grotesk',sans-serif;}

  .navbar{
    height:64px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; border-bottom:1px solid var(--border);
  }
  .brand{font-weight:700; letter-spacing:1.5px; font-size:15px;
    background:linear-gradient(90deg,var(--brown),var(--violet)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
  .session{display:flex; align-items:center; gap:10px;}
  .session svg{width:30px; height:30px;}
  .session span{font-size:13.5px; color:var(--text-dim);}
  .session button{background:transparent; border:1px solid var(--border); color:var(--text-dim);
    padding:6px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; transition:border-color 0.15s, color 0.15s;}
  .session button:hover{border-color:var(--violet); color:#fff;}

  main{max-width:640px; margin:0 auto; padding:30px 24px 100px;}

  .tabs{display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border); overflow-x:auto;}
  .tab{padding:12px 16px; color:var(--text-dim); cursor:pointer; font-size:14px; white-space:nowrap; border-bottom:2px solid transparent;}
  .tab.active{color:#fff; border-color:var(--violet);}

  .panel{display:none; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px;}
  .panel.active{display:block;}
  .panel p.desc{color:var(--text-dim); font-size:14px; margin-bottom:20px;}

  label{display:block; font-size:13px; color:var(--text-dim); margin:14px 0 6px;}
  input, select, textarea{
    width:100%; padding:11px 14px; background:#14141c; border:1px solid var(--border);
    border-radius:9px; color:var(--text); font-family:inherit; font-size:14px;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--violet);}
  textarea{resize:vertical; min-height:90px;}

  button.action{
    margin-top:20px; width:100%; padding:13px; border:none; border-radius:9px;
    background:linear-gradient(120deg, var(--brown), var(--violet)); color:#0a0a0f;
    font-weight:600; font-size:14.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.action:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 10px 26px rgba(201,182,228,0.28);}
  button.action:active:not(:disabled){transform:translateY(0) scale(0.98);}
  button.action:disabled{opacity:0.5; cursor:not-allowed;}

  .spinner{width:16px; height:16px; border:2.5px solid rgba(10,10,15,0.3); border-top-color:#0a0a0f;
    border-radius:50%; animation:spin 0.7s linear infinite; display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  button.loading .spinner{display:inline-block;}

  .result{margin-top:16px; padding:14px 16px; border-radius:9px; font-size:13.5px; display:none;}
  .result.ok{display:block; background:rgba(95,217,122,0.08); border:1px solid rgba(95,217,122,0.3); color:#8ee8a4;}
  .result.err{display:block; background:rgba(224,90,90,0.08); border:1px solid rgba(224,90,90,0.3); color:#f0a3a3;}
  .apikey-box{
    margin-top:14px; padding:14px; background:#14141c; border:1px dashed var(--violet);
    border-radius:9px; font-family:monospace; font-size:13px; word-break:break-all; display:none;
  }

  @media (max-width:480px){ main{padding:20px 16px 100px;} .panel{padding:20px;} }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">G-SOCIETY</div>
  <div class="session">
    <svg id="session-avatar" viewBox="0 0 24 24"></svg>
    <span id="session-username"></span>
    <button onclick="deconnexion()">Déconnexion</button>
  </div>
</nav>

<main>
  <div class="tabs">
    <div class="tab active" data-tab="key">Clé API</div>
    <div class="tab" data-tab="report">Signaler</div>
    <div class="tab" data-tab="delete">Supprimer un serveur</div>
  </div>

  <!-- Clé API : plus besoin de redonner identifiant/mot de passe, la session suffit -->
  <div class="panel active" id="panel-key">
    <p class="desc">Sélectionnez un service, puis générez votre clé. Une clé n'est valable que pour le service choisi.</p>
    <label>Service</label>
    <select id="key-service">
      <option value="glitch">GLITCH — réseau social terminal</option>
    </select>
    <label>Durée de validité</label>
    <select id="key-duree">
      <option value="7">7 jours</option>
      <option value="30">30 jours</option>
      <option value="90" selected>90 jours (maximum)</option>
    </select>
    <button class="action" id="btn-key" onclick="demanderCle()">
      <span class="spinner"></span><span>Générer la clé</span>
    </button>
    <div class="result" id="key-result"></div>
    <div class="apikey-box" id="key-box"></div>
  </div>

  <!-- Signalement -->
  <div class="panel" id="panel-report">
    <p class="desc">Transmis uniquement à l'équipe — jamais visible publiquement.</p>
    <label>Votre clé API</label>
    <input type="text" id="report-key" placeholder="ght_...">
    <label>Identifiant GLITCH concerné</label>
    <input type="text" id="report-glitch-username" placeholder="pseudo utilisé dans le client GLITCH">
    <label>Type de signalement</label>
    <select id="report-type">
      <option value="user">Comportement d'un utilisateur</option>
      <option value="bug">Problème technique</option>
    </select>
    <label>Cible (le cas échéant)</label>
    <input type="text" id="report-target" placeholder="facultatif">
    <label>Motif</label>
    <input type="text" id="report-motif" placeholder="résumé en une phrase">
    <label>Détails</label>
    <textarea id="report-details" placeholder="décrivez la situation"></textarea>
    <button class="action" id="btn-report" onclick="envoyerSignalement()">
      <span class="spinner"></span><span>Envoyer le signalement</span>
    </button>
    <div class="result" id="report-result"></div>
  </div>

  <!-- Suppression -->
  <div class="panel" id="panel-delete">
    <p class="desc">Vérifié automatiquement : seul le créateur du salon peut la déclencher. Irréversible.</p>
    <label>Votre clé API</label>
    <input type="text" id="del-key" placeholder="ght_...">
    <label>Identifiant GLITCH (doit être le créateur du salon)</label>
    <input type="text" id="del-glitch-username" placeholder="pseudo utilisé dans le client GLITCH">
    <label>Nom du serveur à supprimer</label>
    <input type="text" id="del-server" placeholder="nom exact du salon">
    <label>Motif (facultatif)</label>
    <input type="text" id="del-motif" placeholder="raison de la suppression">
    <button class="action" id="btn-delete" onclick="supprimerServeur()">
      <span class="spinner"></span><span>Supprimer définitivement</span>
    </button>
    <div class="result" id="del-result"></div>
  </div>
</main>

<script>
const PLUTON_URL = "https://glitch-wbfo.onrender.com";

// --- Protection de la page : redirection si aucune session ---
const sessionToken = localStorage.getItem('gs_session');
if(!sessionToken){
  window.location.href = "login.html";
}

const TEINTES = ['#e8c39e','#c68863','#8d5524','#f1d1b5'];
function afficherAvatarNav(){
  const avatarId = parseInt(localStorage.getItem('gs_avatar') || '1', 10);
  const teinte = TEINTES[(avatarId - 1) % TEINTES.length];
  document.getElementById('session-avatar').innerHTML = `
    <ellipse cx="12" cy="13" rx="7" ry="8" fill="${teinte}"/>
    <ellipse cx="9.3" cy="13" rx="1" ry="1.3" fill="#241a14"/>
    <ellipse cx="14.7" cy="13" rx="1" ry="1.3" fill="#241a14"/>
    <path d="M9.5 17 Q12 19 14.5 17" stroke="#241a14" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  document.getElementById('session-username').textContent = localStorage.getItem('gs_username') || '';
}
afficherAvatarNav();

function deconnexion(){
  localStorage.removeItem('gs_session');
  localStorage.removeItem('gs_username');
  localStorage.removeItem('gs_avatar');
  window.location.href = "/";
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  });
});

function afficherResultat(id, ok, message){
  const el = document.getElementById(id);
  el.className = 'result ' + (ok ? 'ok' : 'err');
  el.textContent = message;
}

function setChargement(btnId, actif){
  const btn = document.getElementById(btnId);
  btn.classList.toggle('loading', actif);
  btn.disabled = actif;
}

async function demanderCle(){
  const categorie = document.getElementById('key-service').value;
  const duree_jours = parseInt(document.getElementById('key-duree').value, 10);

  setChargement('btn-key', true);
  try {
    const res = await fetch(PLUTON_URL + '/api/session/request-key', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_token: sessionToken, categorie, duree_jours})
    });
    const data = await res.json();
    if(data.success){
      afficherResultat('key-result', true, "Clé générée — copiez-la maintenant, elle ne sera plus réaffichée.");
      const box = document.getElementById('key-box');
      box.style.display = 'block';
      box.textContent = data.api_key;
    } else {
      afficherResultat('key-result', false, data.error);
    }
  } catch(e){ afficherResultat('key-result', false, "Le service est momentanément indisponible."); }
  setChargement('btn-key', false);
}

async function envoyerSignalement(){
  const api_key = document.getElementById('report-key').value.trim();
  const glitch_username = document.getElementById('report-glitch-username').value.trim();
  const type = document.getElementById('report-type').value;
  const target = document.getElementById('report-target').value.trim();
  const motif = document.getElementById('report-motif').value.trim();
  const details = document.getElementById('report-details').value.trim();
  if(!api_key || !glitch_username || !motif){ afficherResultat('report-result', false, "Clé API, identifiant GLITCH et motif requis."); return; }

  setChargement('btn-report', true);
  try {
    const res = await fetch(PLUTON_URL + '/api/report', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({api_key, glitch_username, type, target, motif, details})
    });
    const data = await res.json();
    afficherResultat('report-result', data.success, data.success ? data.message : data.error);
  } catch(e){ afficherResultat('report-result', false, "Le service est momentanément indisponible."); }
  setChargement('btn-report', false);
}

async function supprimerServeur(){
  const api_key = document.getElementById('del-key').value.trim();
  const glitch_username = document.getElementById('del-glitch-username').value.trim();
  const server_name = document.getElementById('del-server').value.trim();
  const motif = document.getElementById('del-motif').value.trim();
  if(!api_key || !glitch_username || !server_name){ afficherResultat('del-result', false, "Clé API, identifiant GLITCH et nom du serveur requis."); return; }
  if(!confirm(`Supprimer définitivement "${server_name}" ? Cette action est irréversible.`)) return;

  setChargement('btn-delete', true);
  try {
    const res = await fetch(PLUTON_URL + '/api/delete-server', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({api_key, glitch_username, server_name, motif})
    });
    const data = await res.json();
    afficherResultat('del-result', data.success, data.success ? data.message : data.error);
  } catch(e){ afficherResultat('del-result', false, "Le service est momentanément indisponible."); }
  setChargement('btn-delete', false);
}
</script>

</body>
</html>
